<style>
  :root {
    --bg: #e7dec6; --panel: #f4efe2; --line: #c4b89c; --ink: #2a2520; --muted: #6b6155; --shu: #b3302a; --kin: #c9a54a;

    --float: 0 2px 0 rgba(42, 37, 32, .14);

    --safe-l: env(safe-area-inset-left, 0px); --safe-r: env(safe-area-inset-right, 0px);
  }
  :root:not([lang="zh-CN"]) {
    --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
    --serif: "Noto Serif JP", "Source Han Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .float { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--float); }

  #top { position: fixed; top: calc(10px + var(--safe-t)); left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 6px 10px; text-decoration: none; color: var(--ink); }
  .brand img { width: 22px; height: 22px; }
  .brand b { font: 700 15px var(--serif); }
  .brand small { color: var(--muted); }
  #years { display: flex; padding: 3px; gap: 2px; }
  #years button { border: 0; background: none; padding: 5px 10px; border-radius: 3px; font-weight: 600; min-height: 32px; }
  #years button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
  /* 时代（3.35）：六个时代一组（3.38 起），选中的写朱底白字，像年份行上面的一枚印 */
  #eras { display: flex; padding: 3px; gap: 2px; }
  #eras button { border: 0; background: none; padding: 5px 9px; border-radius: 3px; font: 700 14px var(--serif); min-height: 32px; letter-spacing: .04em; }
  #eras button:hover { background: rgba(42, 37, 32, .07); }
  #eras button[aria-selected="true"] { background: var(--shu); color: #fff; }
  #busy { position: fixed; left: 50%; top: calc(var(--top-h, 60px) + 10px); transform: translateX(-50%); padding: 6px 14px; font-size: 13px; z-index: 5; }
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .tools button, #nav button { min-width: 36px; min-height: 36px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; box-shadow: var(--float); display: inline-grid; place-items: center; }
  .tools button.wide { padding: 0 12px; font: 700 14px var(--serif); display: inline-flex; align-items: center; gap: 4px; }
  .tools svg, #nav svg { width: 20px; height: 20px; }
  #nav { position: fixed; right: calc(10px + var(--safe-r)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
  #nav button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  body.card-open #nav { right: calc(320px + var(--safe-r)); }
  #card, #settings, #search, #help3d { top: calc(var(--top-h, 50px) + 10px); }
  #help3d { position: fixed; right: calc(10px + var(--safe-r)); width: 330px; max-width: calc(100% - 20px - var(--safe-l) - var(--safe-r)); max-height: calc(100% - var(--top-h, 50px) - 30px); overflow: auto; padding: 10px 14px 12px; z-index: 6; }
  #help3d .h3-head { display: flex; align-items: center; justify-content: space-between; }
  #help3d .h3-head b { font: 700 16px var(--serif); }
  #help3d .x { border: 0; background: none; font-size: 20px; width: 32px; height: 32px; }

  #help3d h3 { margin: 0 0 2px; font: 700 13px var(--serif); }
  #help3d p { margin: 0; font-size: 12.5px; line-height: 1.65; }
  #btn-help { font: 700 15px var(--serif); }
  #here { position: fixed; left: calc(10px + var(--safe-l)); top: calc(var(--top-h, 50px) + 10px); width: 290px; max-width: calc(100% - 20px); max-height: calc(100% - var(--top-h, 50px) - 140px); display: flex; flex-direction: column; padding: 8px 12px 10px; z-index: 5; }
  #here .here-head { display: flex; align-items: center; gap: 6px; }

  @media (max-width: 640px) { #here { max-height: 42%; } }

  @media (max-width: 640px) { #peaks { top: auto; bottom: calc(80px + var(--safe-b)); right: 10px; left: 10px; width: auto; max-height: 34%; } }
  /* 3.38：块卡片的「看此地千年」与「京」卡片里的历代实权 */
  #card .here-go { border: 1px solid var(--shu); background: transparent; color: var(--shu); border-radius: 3px; padding: 5px 12px; font: 600 13px var(--serif); min-height: 32px; cursor: pointer; }
  #card .here-go:hover { background: var(--shu); color: var(--panel); }
  #card .pw-all { margin: 8px 0; }
  #card .pw-all summary { cursor: pointer; font: 700 13px var(--serif); }
  #card .pw-all ol { list-style: none; margin: 6px 0 4px; padding: 0; display: grid; gap: 2px; }
  #card .pw-all li > * { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 4px 6px; font: 500 13px var(--serif); text-align: left; border-radius: 3px; }
  #card .pw-all li button { border: 0; background: transparent; color: var(--ink); cursor: pointer; min-height: 30px; }
  #card .pw-all li button:hover { background: rgba(179, 48, 42, .08); }
  #card .pw-all li span { color: var(--muted); }
  #card .pw-all li small { color: var(--muted); font-variant-numeric: tabular-nums; }
  #card .pw-all li.cur > * { background: rgba(179, 48, 42, .1); font-weight: 700; }
  #card .look-btn { border: 1px solid var(--ink); background: var(--ink); color: var(--panel); border-radius: 3px; padding: 5px 12px; font: 600 13px var(--serif); min-height: 32px; }
  #lookout-bar { position: fixed; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; z-index: 6; white-space: nowrap; }
  #lookout-bar b { font: 700 15px var(--serif); }

  #search { position: fixed; top: calc(60px + var(--safe-t)); right: calc(10px + var(--safe-r)); width: 280px; padding: 8px; }

  #battle { position: fixed; left: calc(10px + var(--safe-l)); bottom: calc(26px + var(--safe-b)); width: 360px; max-height: calc(100% - 120px); overflow: auto; padding: 10px 12px; }
  #battle .bt-head { display: flex; align-items: center; gap: 8px; }

  #battle .bt-ctl { display: flex; gap: 6px; margin-top: 8px; }

  /* 合战面板（包括选合战的列表）开着时，同在左下角的图例让开 */
  body.in-battle #legend, body.in-battle #hint, body.battle-open #legend, body.battle-open #hint { display: none; }
  .lb.bt-field { font: 700 15px var(--serif); color: var(--shu); }

  .lb.bt-from { border-left-color: var(--muted); }

  /* 年份之间（story.js）：底部正中一行「这期间 · N 件事」，点开是列表或一件事的说明 */
  #story { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(66px + var(--safe-b)); width: min(440px, calc(100% - 520px)); min-width: 300px; max-height: 46%; overflow: auto; padding: 10px 12px; }

  #story .st-head { display: flex; align-items: center; gap: 8px; }
  #story .st-head b { flex: 1; font: 700 16px var(--serif); }

  #story .x { border: 0; background: none; font-size: 20px; width: 32px; height: 32px; }

  #story .st-list { margin: 4px 0 0; padding: 0; list-style: none; }

  #story .st-list button:hover { background: rgba(42, 37, 32, .07); }
  #story .st-list span { color: var(--shu); font-family: var(--sans); width: 3em; flex: none; }
  #story .st-ctl { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; }
  #story .st-ctl button { min-width: 34px; min-height: 32px; border: 1px solid var(--line); background: none; border-radius: 3px; font-weight: 600; }
  #story .st-ctl button:disabled { opacity: .35; }
  #story .st-ctl .st-bt { padding: 0 10px; border-color: var(--shu); color: var(--shu); }
  #story .st-ctl a { margin-left: auto; color: var(--shu); font-size: 12px; }
  body.in-battle #story { display: none; }
  /* 平板宽度：底部正中放不下「这期间」又不压到左下的图例，挪到右下开关上方 */
  @media (min-width: 641px) and (max-width: 1000px) { #story, #story:has(.st-chip) { left: auto; right: calc(10px + var(--safe-r)); transform: none; bottom: calc(76px + var(--safe-b)); width: min(420px, calc(100% - 290px)); min-width: 0; } }
  .lb.st-pin { font: 700 14px var(--serif); color: var(--shu); padding: 1px 6px; background: rgba(244, 239, 226, .92); border: 1px solid var(--shu); border-radius: 2px; text-shadow: none; visibility: visible; }
  /* 京：一直在，写着「天下」在谁手里；能点 */

  #card table.kv th { width: 5.5em; color: var(--muted); font-weight: 600; font-size: 12px; }
  #card .who[data-person] { cursor: pointer; text-decoration: underline dotted; }

  #legend { position: fixed; left: calc(10px + var(--safe-l)); bottom: calc(26px + var(--safe-b)); max-width: 240px; max-height: 50vh; overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 1px; }

  .sw { display: inline-block; width: 14px; height: 10px; border-radius: 50%; border: 1px solid rgba(42, 37, 32, .5); flex: none; vertical-align: -1px; margin-right: 3px; }

  #settings { position: fixed; top: calc(60px + var(--safe-t)); right: calc(10px + var(--safe-r)); width: 230px; padding: 10px 12px; }

  #card tr[data-y] { cursor: pointer; }
  #card tr.cur { background: rgba(179, 48, 42, .1); }
  #card em { font-style: normal; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; margin-left: 4px; }
  #card .who { display: block; color: var(--muted); font-size: 12px; }
  #card .note { color: var(--muted); font-size: 12px; }
  #card .meijo { margin: 4px 0; padding: 2px 0 2px 8px; border-left: 3px solid var(--shu); font: 600 13px var(--serif); }
  #card .meijo.k { border-left-color: var(--kin); }
  #card .life-h { margin: 10px 0 2px; font: 700 13px var(--serif); }
  #card .life th { width: auto; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #card .links a { color: var(--shu); }

  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; visibility: hidden; color: var(--ink); text-shadow: 0 0 2px var(--bg), 0 0 2px var(--bg), 0 0 4px var(--bg); will-change: transform; }
  .lb.on { visibility: visible; }
  .lb.prov { font: 500 12px var(--serif); opacity: .85; }
  .lb.clan { display: flex; align-items: center; gap: 4px; font: 700 15px var(--serif); padding-bottom: 2px; }
  .lb.clan b { border-bottom: 3px solid var(--c); }
  .lb.clan .mon { display: grid; place-items: center; width: 24px; height: 24px; background: var(--ink); border: 2px solid; border-radius: 2px; }
  .lb.clan .mon i { width: 18px; height: 18px; background: var(--kin); -webkit-mask: var(--mon) center / contain no-repeat; mask: var(--mon) center / contain no-repeat; }
  .lb.castle { font: 700 13px var(--serif); padding: 1px 5px; background: rgba(244, 239, 226, .9); border: 1px solid var(--ink); border-radius: 2px; text-shadow: none; }
  .lb.site { font-size: 12px; text-shadow: 0 0 2px #fff, 0 0 3px #fff; }
  .lb.site small { color: var(--shu); margin-right: 3px; }
  .lb.prov.blk { font: 700 13px var(--serif); opacity: 1; }
  .lb.castle.fort { border-color: var(--kin); }
  .lb.site.inn { font-size: 11px; color: #5a3c28; }
  .lb.capital.bak b { background: var(--ink); }
  /* 江户：广重的浮世绘挂在画中地点，点开看大图 */
  .lb.print { pointer-events: auto; cursor: pointer; padding: 2px; background: #f7f1e3; border: 1px solid var(--ink); box-shadow: 0 2px 0 rgba(42, 37, 32, .25); text-shadow: none; }
  .lb.print img { display: block; width: 34px; height: 48px; object-fit: cover; }
  #card .print-big { width: 100%; border: 1px solid var(--line); margin: 4px 0; }
  #card ul.plain { margin: 4px 0 8px; padding: 0; list-style: none; }
  #card ul.plain small { color: var(--shu); margin-right: 4px; }

  /* 平面 / 立体开关（3.35 改版）：漆黑底、金边，金箔片滑到当前一侧；与主站地图上的开关同一个样子、同在右下 */
  #viewtoggle { position: fixed; right: calc(10px + var(--safe-r)); bottom: calc(26px + var(--safe-b)); z-index: 3; }
  .viewswitch { display: inline-flex; position: relative; padding: 3px; border-radius: 22px; isolation: isolate;
    background: linear-gradient(#332c26, #1f1a16); border: 1px solid #b08a3e;
    box-shadow: 0 3px 0 rgba(42, 37, 32, .28), inset 0 1px 0 rgba(255, 236, 190, .14); }
  .viewswitch::before { content: ""; position: absolute; z-index: -1; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 19px;
    background: linear-gradient(115deg, #f3dc94 0%, #c9a24e 38%, #a77d2e 62%, #e8cb7c 100%); background-size: 220% 100%;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -1px 0 rgba(60, 40, 10, .35);
    transition: transform .38s cubic-bezier(.3, 1.35, .5, 1); animation: vs-shine 1.6s ease-out .6s 1 both; }
  .viewswitch[data-on="3d"]::before { transform: translateX(100%); }
  .viewswitch:hover::before { animation: vs-shine 1.1s ease-out 1; }
  @keyframes vs-shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .viewswitch > a, .viewswitch > button, .viewswitch > span { flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 78px; height: 34px; padding: 0 12px;
    border: 0; border-radius: 19px; background: none; font: 700 14px var(--serif); letter-spacing: .1em; color: #ead9ae; text-decoration: none; cursor: pointer; transition: color .25s; }
  .viewswitch > a:hover, .viewswitch > button:hover { color: #fff4d2; }
  .viewswitch > [aria-current] { color: #2a2520; cursor: default; }
  .viewswitch svg { width: 18px; height: 18px; flex: none; }
  @media (prefers-reduced-motion: reduce) { .viewswitch::before { transition: none; animation: none; } }
  #credit { position: fixed; right: calc(8px + var(--safe-r)); bottom: calc(4px + var(--safe-b)); font-size: 10px; color: var(--muted); text-shadow: 0 0 2px var(--bg); max-width: 70%; text-align: right; }
  #hint { pointer-events: none; }
  #hint { position: fixed; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translateX(-50%); font-size: 12px; color: var(--muted); padding: 4px 10px; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 10; }
  #loading div { text-align: center; }
  #loading img { width: 56px; height: 56px; animation: pulse 1.4s ease-in-out infinite; }
  #loading.failed img { animation: none; filter: grayscale(1); }
  #loading p { margin: 10px 0 0; color: var(--muted); }
  @keyframes pulse { 50% { opacity: .4; } }

  /* 卡片打开时开关挪到卡片左边；操作提示第一次拖动或点按后就收起，平板与手机不显示（会压住图例） */
  body.card-open #viewtoggle { right: calc(320px + var(--safe-r)); }
  body.used #hint { display: none; }
  @media (max-width: 900px) { #hint { display: none; } }
  /* 横屏手机：右侧按钮从上面排、小一点；卡片矮一点 */
  @media (max-height: 520px) and (orientation: landscape) {
    #nav { top: calc(60px + var(--safe-t)); transform: none; gap: 4px; }
    #nav button { min-width: 32px; min-height: 32px; }
    #legend { max-height: calc(100% - 90px); }
    #card { max-height: calc(100% - 70px); }
    #battle { max-height: calc(100% - 70px); }
  }
  @media (max-width: 640px) {
    .brand small, #hint { display: none; }
    #eras { order: 3; width: 100%; justify-content: space-between; }
    #eras button { flex: 1; padding: 5px 0; }
    #years { order: 4; width: 100%; justify-content: space-between; }
    #years button { flex: 1; padding: 5px 0; }
    #card { top: auto; bottom: calc(10px + var(--safe-b)); left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); width: auto; max-height: 46%; }
    #legend { left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); bottom: calc(36px + var(--safe-b)); max-width: none; max-height: none; flex-direction: row; overflow-x: auto; padding: 4px; font-size: 13px; scrollbar-width: none; }
    #legend button { flex: none; white-space: nowrap; }
    #legend button span { padding-left: 4px; }
    #legend .more { flex: none; white-space: nowrap; align-self: center; }
    #legend .cap { flex: none; align-self: center; max-width: 9em; margin: 0 4px 0 0; padding: 0 6px 0 2px; border: 0; border-right: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #years .play { flex: none; width: 44px; }
    body.card-open #legend, body.card-open #credit, body.in-battle #credit, body.in-battle #viewtoggle { display: none; }
    #credit { max-width: 100%; left: 8px; font-size: 9px; }
    #viewtoggle { bottom: auto; top: calc(var(--top-h, 104px) + 8px); }
    .viewswitch > a, .viewswitch > button, .viewswitch > span { min-width: 64px; height: 30px; font-size: 13px; padding: 0 9px; }
    #nav { top: calc(var(--top-h, 104px) + 56px); transform: none; }
    body.card-open #nav, body.in-battle #nav { display: none; }
    #search { left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); width: auto; }
    #battle { left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); bottom: calc(10px + var(--safe-b)); width: auto; max-height: 48%; }
    .tools button.wide { padding: 0 8px; }
    #story { left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); transform: none; width: auto; min-width: 0; bottom: calc(82px + var(--safe-b)); }
    #story:has(.st-chip) { left: 50%; right: auto; transform: translateX(-50%); }
    body.card-open #story { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene" data-t-aria="scene" aria-label="立体古今图：拖动平移，滚轮或双指缩放，右键或双指旋转"></canvas>
<div id="labels"></div>
<div id="top">
  <a class="brand float" id="back" href="index.html" data-t-title="backTitle" title="回到平面战国图">
    <img src="src/assets/icons/seal.svg" alt=""><b data-t="brand">立体古今图</b><small data-t="back">← 平面地图</small>
  </a>
  <div id="eras" class="float" role="tablist" data-t-aria="eras" aria-label="时代"></div>
  <div id="years" class="float" role="group" data-t-aria="years" aria-label="年份"></div>

    <button id="btn-battle" class="wide" type="button" data-t-title="bt.title"><span aria-hidden="true">⚔</span> <span data-t="bt">合战</span></button>
    <button id="btn-search" type="button" data-t-title="search" data-t-aria="search" title="搜索" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button id="btn-help" type="button" data-t-title="help" data-t-aria="help" title="说明" aria-label="说明">?</button>
    <button id="btn-settings" type="button" data-t-title="settings" data-t-aria="settings" title="设置" aria-label="设置">⚙</button>
  </div>
</div>
<div id="nav">
  <button id="btn-in" type="button" data-t-title="in" data-t-aria="in" title="拉近" aria-label="拉近">＋</button>
  <button id="btn-out" type="button" data-t-title="out" data-t-aria="out" title="拉远" aria-label="拉远">－</button>
  <button id="btn-home" type="button" data-t-title="home" data-t-aria="home" title="回到全国" aria-label="回到全国">⌂</button>
  <button id="btn-north" type="button" data-t-title="north" data-t-aria="north" title="朝北" aria-label="朝北"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l4.5 9h-9z" fill="#b3302a"/><path d="M12 21l-4.5-9h9z" fill="currentColor" opacity=".45"/></svg></button>
  <button id="btn-tilt" type="button" data-t-title="tilt" data-t-aria="tilt" title="俯视 / 斜看" aria-label="俯视 / 斜看" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l9 4 9-4-9-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 3v8M9 8l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>
<div id="search" class="float" hidden>
  <input id="search-q" type="search" autocomplete="off" data-t-ph="searchPh" placeholder="国名、城名或家名">
  <div id="search-list" role="listbox"></div>
</div>
<div id="battle" class="float" hidden aria-live="polite"></div>
<div id="story" class="float" hidden aria-live="polite"></div>
<div id="help3d" class="float" hidden></div>
<div id="here" class="float" hidden aria-live="polite"></div>
<div id="peaks" class="float" hidden aria-live="polite"></div>
<div id="lookout-bar" class="float" hidden aria-live="polite"><b></b><span data-t="look.tip">拖动环顾四周</span><button type="button" data-t="look.back">回到地图</button></div>
<div id="settings" class="float" hidden>
  <h3 data-t="exag">地形起伏</h3>
  <div class="seg"><button type="button" data-exag="1" data-t="real">实际</button><button type="button" data-exag="2">×2</button><button type="button" data-exag="3">×3</button></div>
  <h3 data-t="quality">画质</h3>

  <label><input type="checkbox" data-opt="tint"> <span data-t="o.tint">势力着色</span></label>
  <label><input type="checkbox" data-opt="castles"> <span data-t="o.castles">城</span></label>
  <label><input type="checkbox" data-opt="sites"> <span data-t="o.sites">一宫·国府·国分寺</span></label>
  <label><input type="checkbox" data-opt="trees"> <span data-t="o.trees">树林（拉近时）</span></label>
  <label><input type="checkbox" data-opt="motion"> <span data-t="o.motion">动态（海浪、旗、雾、炊烟）</span></label>
  <label><input type="checkbox" id="opt-sound"> <span data-t="o.sound">声音</span></label>
  <button id="btn-save" class="save" type="button" data-t="save">把这个画面存成图片</button>
</div>
<div id="legend" class="float"></div>
<div id="viewtoggle" class="viewswitch" data-on="3d" role="group" data-t-aria="view">
  <a id="to2d" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" stroke="currentColor" stroke-width="1.4"/></svg><span data-t="flat2d">平面</span></a><span aria-current="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19l6.5-10 3.5 5.2 2.8-4.2L22 19z" fill="currentColor"/><path d="M8.5 9l1.6 2.4-1.6-.6-1.4 1z" fill="#f4efe2" opacity=".75"/><circle cx="18" cy="6" r="2" fill="currentColor"/></svg><span data-t="flat3d">立体</span></span>
</div>
<div id="busy" class="float" hidden aria-live="polite"></div>
<div id="card" class="float" hidden></div>
<div id="hint" class="float" data-t="hint">拖动平移 · 滚轮缩放 · 右键拖动旋转 · 点一国看六个年份</div>
<div id="credit" data-t="credit">地形：国土地理院 標高タイル · 湖河与土地覆盖：地球地図日本 · 城：Wikidata / 日文维基百科 · 渲染：three.js</div>
<div id="loading"><div><img src="src/assets/icons/seal.svg" alt=""><p id="loading-text" data-t="loading">正在加载…</p><div id="loading-bar"><i></i></div><a id="loading-back" href="index.html" hidden data-t="back2d">回到平面地图</a></div></div>

{ "imports": { "three": "./src/3d/vendor/three.module.min.js" } }
