# 每次推送 / PR：先跑数据检查（几秒），通过后再用真实浏览器跑界面冒烟测试（分 8 片并行，各约 4 分钟；4 片时整轮约 9 分钟）。
# 推送到 main 且两项都通过时才发布到 GitHub Pages；任何一项失败，网站保持上一版。
# （仓库 Settings → Pages → Source 须设为「GitHub Actions」）
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch: # 可在 Actions 页面手动重跑（例如重新发布）

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Data & repo consistency
        run: python -X utf8 tools/check_data.py
      - name: Tool unit tests
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py"

  ui:
    runs-on: ubuntu-latest
    needs: data
    strategy:
      fail-fast: false # 一片失败时其余照跑完，一次看到全部失败
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: ui (${{ matrix.shard }}/8)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/checks.yml
      - name: Install Playwright
        run: pip install playwright==1.64.1
      # 浏览器本体（约 150 MB）按 Playwright 版本缓存；系统依赖（apt）每次照装
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.1-chromium-${{ runner.os }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - name: Install Chromium system dependencies
        run: python -m playwright install-deps chromium
      - name: UI smoke tests (desktop / tablet / phone × zh / en / ja)
        run: python -X utf8 tests/smoke.py
        env:
          SMOKE_SHARD: ${{ matrix.shard }}/8
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ matrix.shard }}
          path: tests/artifacts/

  deploy:
    # 只有 main 分支的推送（或手动运行）才发布；PR 与其他分支只做检查
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [data, ui]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (only what the page needs — no tools/ or tests/)
        run: |
          mkdir _site
          cp -r index.html 3d.html manifest.webmanifest sw.js src _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
