<!doctype html>
<!-- 分享封面（1200×630）模板：tools/make_og.py 用 Playwright 按语言截图，生成 src/assets/og-cover{,-en,-ja}.png -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Serif+JP:wght@700;900&family=Noto+Sans+SC:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #e7dec6; }
  body {
    position: relative; color: #2a2520; font-family: 'Noto Sans SC', 'Noto Sans JP', sans-serif;
    background: #e7dec6;
  }
  :lang(ja) body, body.ja { font-family: 'Noto Sans JP', 'Noto Sans SC', sans-serif; }
  #map { position: absolute; right: 0; top: 0; width: 640px; height: 630px; border-left: 2px solid #2a2520;
    background: radial-gradient(ellipse 80% 70% at 62% 45%, #a3bcc5 0%, #8ba7b3 80%); }  /* 群青淡刷的海 */
  .text { position: absolute; left: 72px; top: 64px; width: 600px; }
  .kicker { font: 500 22px 'Noto Sans SC', sans-serif; letter-spacing: .08em; color: #7a5719; }
  h1 { margin: 14px 0 0; font: 900 84px/1.08 'Noto Serif SC', 'Noto Serif JP', serif; letter-spacing: .02em; }
  body.ja h1 { font-family: 'Noto Serif JP', 'Noto Serif SC', serif; }
  body.en h1 { font-size: 66px; line-height: 1.12; letter-spacing: 0; }
  h1 em { font-style: normal; color: #b3302a; }
  .sub { margin-top: 14px; font: 700 30px 'Noto Serif SC', 'Noto Serif JP', serif; color: #4f473d; }
  body.en .sub { font-size: 27px; }
  .tags { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; width: 560px; }
  .tags span { padding: 6px 14px; border-radius: 3px; border: 1px solid #c4b89c; background: #f4efe2; font-size: 18px; color: #2a2520; }
  .tags span.hot { border-color: #2a2520; }
  .langs { position: absolute; left: 72px; bottom: 40px; width: 460px; padding-top: 18px; border-top: 1px solid #2a2520;
    font-size: 21px; letter-spacing: .06em; color: #6b6155; }
</style>
</head>
<body>
<div id="map"></div>
<div class="text">
  <div class="kicker">Japan Explorer</div>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div class="tags" id="tags"></div>
</div>
<div class="langs">中文 · English · 日本語</div>
<script src="../src/vendor/echarts.min.js"></script>
<script>
  const T = {
    zh: { title: '<em>古今</em>日本<br>地图', sub: '68 古国 ⇄ 47 都道府县',
      tags: [['68 令制国'], ['战国势力图'], ['合战沙盘'], ['彼时今日', 1], ['古代户籍', 1], ['江户诸藩'], ['立体地图']] },
    en: { title: 'Japan,<br><em>Then and Now</em>', sub: '68 ancient provinces ⇄ 47 prefectures',
      tags: [['68 provinces'], ['Sengoku map'], ['Battles'], ['On this day', 1], ['Ancestral register', 1], ['Edo domains'], ['3D map']] },
    ja: { title: '<em>古今</em>日本<br>地図', sub: '68の旧国 ⇄ 47都道府県',
      tags: [['68の令制国'], ['戦国勢力図'], ['合戦沙盤'], ['今日は何の日', 1], ['古代の戸籍', 1], ['江戸の諸藩'], ['立体地図']] },
  };
  // 五畿七道配色（与 src/js/map.js 的 FILTERS.circuit 一致）
  const CIRCUIT = { 畿内: '#d46e64', 东海道: '#d2a171', 东山道: '#89aa79', 北陆道: '#79aac3', 山阴道: '#9d92c9', 山阳道: '#d9875e', 南海道: '#60ada5', 西海道: '#ce7ea2', 北海道: '#b7c4cc', 令制外: '#d6ccb6' };
  const lang = new URLSearchParams(location.search).get('lang') || 'zh';
  const L = T[lang];
  document.body.classList.add(lang);
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.getElementById('title').innerHTML = L.title;
  document.getElementById('sub').textContent = L.sub;
  document.getElementById('tags').innerHTML = L.tags.map(([s, hot]) => `<span class="${hot ? 'hot' : ''}">${s}</span>`).join('');

  Promise.all([fetch('../src/data/provinces.json').then((r) => r.json()), fetch('../src/data/koku_sites.json').then((r) => r.json())])
    .then(([prov, sites]) => {
      for (const f of prov.features) f.properties.name = f.properties.key;
      echarts.registerMap('prov', prov);
      const chart = echarts.init(document.getElementById('map'), null, { renderer: 'canvas', devicePixelRatio: 2 });
      const ichi = (Array.isArray(sites) ? sites : sites.sites || []).filter((s) => s.kind === 'ichi' && s.coords);
      chart.setOption({
        animation: false,
        geo: {
          map: 'prov', center: [136.6, 38.2], zoom: 1.4, layoutCenter: ['46%', '50%'], layoutSize: '100%', silent: true,
          itemStyle: { borderColor: '#5a5046', borderWidth: 0.7 },
          regions: prov.features.map((f) => ({ name: f.properties.key, itemStyle: { areaColor: CIRCUIT[f.properties.circuit] || '#d6ccb6' } })),
        },
        series: [{
          type: 'scatter', coordinateSystem: 'geo', symbolSize: 6, silent: true,
          itemStyle: { color: '#b3302a', borderColor: '#f4efe2', borderWidth: 1 },
          data: ichi.map((s) => s.coords),
        }],
      });
      document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
    });
</script>
</body>
</html>
